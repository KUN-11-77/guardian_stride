# gs_planning/config/nav2_params.yaml
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 5.0
      height: 5.0
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["semantic_layer", "obstacle_layer", "inflation_layer"]
      semantic_layer:
        plugin: "guardian_stride::SemanticCostmapPlugin"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      width: 50.0
      height: 50.0
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["semantic_layer", "obstacle_layer", "inflation_layer"]
      semantic_layer:
        plugin: "guardian_stride::SemanticCostmapPlugin"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
